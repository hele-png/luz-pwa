<!doctype html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luz · Tus ojos, por voz</title>
<meta name="description" content="Luz: asistente visual por voz con IA para personas ciegas o con baja visión.">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luz">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4 7-19z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7v.5M12 17.5v.01"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
</svg>

<header class="top">
  <h1 class="brand"><span class="dot" aria-hidden="true"></span>Luz</h1>
  <div class="top-actions">
    <button id="btn-stop" class="icon-btn" type="button" aria-label="Parar"><svg aria-hidden="true"><use href="#i-stop"/></svg></button>
    <button id="btn-settings" class="icon-btn" type="button" aria-label="Ajustes" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
  </div>
</header>

<main id="main">
  <section class="status-wrap" aria-label="Estado">
    <p id="state-chip" class="chip" data-state="idle" aria-hidden="true">Lista</p>
    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">Toca el botón y habla.</p>
    <p id="alert" class="sr-only" role="alert" aria-atomic="true"></p>
  </section>

  <div id="camera-wrap" class="camera" hidden aria-hidden="true">
    <video id="camera" playsinline muted autoplay></video>
  </div>

  <div class="mic-wrap">
    <button id="mic" class="mic" type="button" data-state="idle"
            aria-label="Hablar con Luz" aria-describedby="mic-hint">
      <span class="halo" aria-hidden="true"></span>
      <span class="core" aria-hidden="true"><svg><use href="#i-mic"/></svg></span>
    </button>
    <p id="mic-text" class="mic-text" aria-hidden="true">Toca y habla</p>
    <p id="mic-hint" class="sr-only">Toca, espera el tono y habla. Por ejemplo: qué hay delante, lee esto, qué es esto, o llévame a la farmacia.</p>
  </div>

  <section id="nav-panel" class="nav-panel" hidden aria-label="Ruta en curso">
    <p id="nav-next" class="nav-next"></p>
    <div class="nav-actions">
      <button type="button" class="pill-btn" data-intent="next">Siguiente</button>
      <button type="button" class="pill-btn" data-intent="repeat">Repetir</button>
      <button type="button" class="pill-btn danger" data-intent="end_route">Terminar</button>
    </div>
  </section>

  <section aria-label="Acciones">
    <ul class="grid" role="list">
      <li><button type="button" class="card" data-intent="describe"><svg aria-hidden="true"><use href="#i-eye"/></svg><span>Qué hay delante</span></button></li>
      <li><button type="button" class="card" data-intent="read"><svg aria-hidden="true"><use href="#i-text"/></svg><span>Leer texto</span></button></li>
      <li><button type="button" class="card" data-intent="identify"><svg aria-hidden="true"><use href="#i-hand"/></svg><span>¿Qué es esto?</span></button></li>
      <li><button type="button" class="card" data-intent="navigate"><svg aria-hidden="true"><use href="#i-nav"/></svg><span>Llévame a…</span></button></li>
      <li><button type="button" class="card" data-intent="where"><svg aria-hidden="true"><use href="#i-pin"/></svg><span>¿Dónde estoy?</span></button></li>
      <li><button type="button" class="card" data-intent="help"><svg aria-hidden="true"><use href="#i-help"/></svg><span>Ayuda</span></button></li>
    </ul>
  </section>

  <form id="cmd-form" class="ask" autocomplete="off">
    <label for="cmd-input" class="sr-only">Escribe o dicta una orden o una pregunta</label>
    <input id="cmd-input" type="text" enterkeyhint="send" placeholder="Escribe o dicta una pregunta…">
    <button type="submit" class="send" aria-label="Enviar">→</button>
  </form>
</main>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" class="sheet">
    <h2 id="settings-title">Ajustes</h2>
    <div class="row">
      <label for="rate">Velocidad de la voz</label>
      <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="1" aria-valuetext="Normal">
    </div>
    <div class="row toggle"><label for="voice-on">Voz de Luz <small>Desactívala si prefieres que lea VoiceOver</small></label><input id="voice-on" type="checkbox" switch role="switch" checked></div>
    <div class="row toggle"><label for="vibrate-on">Vibración <small>Solo en Android</small></label><input id="vibrate-on" type="checkbox" switch role="switch" checked></div>
    <div class="row toggle"><label for="fast-sr">Reconocimiento rápido del navegador <small>Si falla, Luz usa la IA</small></label><input id="fast-sr" type="checkbox" switch role="switch"></div>
    <div class="row">
      <label for="api-key">Clave de Gemini propia <small>Opcional. Déjala vacía para usar la incluida.</small></label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Pega aquí tu clave">
      <div class="row-actions">
        <button type="button" id="key-save" class="pill-btn">Guardar clave</button>
        <button type="button" id="key-reset" class="pill-btn">Usar la incluida</button>
      </div>
    </div>
    <button type="button" id="btn-test" class="pill-btn wide">Probar la voz</button>
    <button value="close" class="pill-btn wide accent">Cerrar</button>
  </form>
</dialog>

<script src="key.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
